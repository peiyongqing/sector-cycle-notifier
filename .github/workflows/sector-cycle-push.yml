name: Sector Cycle Push

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sector-cycle-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Checkout notifier state
        uses: actions/checkout@v4

      - name: Poll private outbox and notify Feishu
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
          SOURCE_REPO: peiyongqing/sector-cycle-agent
          SOURCE_PATH: notifications/pending.json
        run: |
          python3 - <<'PY'
          import os
          import time
          import hmac
          import hashlib
          import base64
          import json
          import urllib.request
          import urllib.error
          from pathlib import Path

          token = os.environ.get("SOURCE_REPO_TOKEN", "").strip()
          webhook = os.environ.get("FEISHU_WEBHOOK_URL", "").strip()
          secret = os.environ.get("FEISHU_BOT_SECRET", "").strip()
          repo = os.environ.get("SOURCE_REPO", "").strip()
          path = os.environ.get("SOURCE_PATH", "").strip()

          if not token:
              raise SystemExit("Missing SOURCE_REPO_TOKEN secret")
          if not webhook:
              raise SystemExit("Missing FEISHU_WEBHOOK_URL secret")
          if not secret:
              raise SystemExit("Missing FEISHU_BOT_SECRET secret")

          api_url = f"https://api.github.com/repos/{repo}/contents/{path}?ref=main"
          request = urllib.request.Request(
              api_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github.raw+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "sector-cycle-notifier/1.0",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  raw = response.read().decode("utf-8")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"GitHub source read failed {exc.code}: {body}")

          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              raise SystemExit("Private outbox is not valid JSON")

          event_id = str(payload.get("id", "")).strip()
          should_send = bool(payload.get("send"))
          title = str(payload.get("title", "Sector Cycle Agent")).strip()
          level = str(payload.get("level", "info")).strip().lower()
          message = str(payload.get("message", "")).strip()

          if not event_id:
              raise SystemExit("Private outbox missing id")

          state_dir = Path("state")
          state_dir.mkdir(exist_ok=True)
          state_file = state_dir / "last-sent-id.txt"
          last_id = state_file.read_text(encoding="utf-8").strip() if state_file.exists() else ""

          if not should_send:
              print("Outbox send=false; nothing to send.")
              raise SystemExit(0)

          if event_id == last_id:
              print("Event already sent; nothing to do.")
              raise SystemExit(0)

          if not message:
              raise SystemExit("Outbox send=true but message is empty")

          timestamp = str(int(time.time()))
          string_to_sign = f"{timestamp}\n{secret}"
          digest = hmac.new(
              string_to_sign.encode("utf-8"),
              b"",
              hashlib.sha256,
          ).digest()
          sign = base64.b64encode(digest).decode("utf-8")

          level_meta = {
              "info": ("📌", "blue"),
              "opportunity": ("🟢", "green"),
              "risk": ("⚠️", "red"),
              "close": ("📊", "purple"),
          }
          emoji, template = level_meta.get(level, ("📌", "blue"))

          feishu_payload = {
              "timestamp": timestamp,
              "sign": sign,
              "msg_type": "interactive",
              "card": {
                  "config": {"wide_screen_mode": True},
                  "header": {
                      "template": template,
                      "title": {
                          "tag": "plain_text",
                          "content": f"{emoji} {title}",
                      },
                  },
                  "elements": [
                      {
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": message,
                          },
                      }
                  ],
              },
          }

          body = json.dumps(feishu_payload, ensure_ascii=False).encode("utf-8")
          notify_request = urllib.request.Request(
              webhook,
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(notify_request, timeout=15) as response:
                  response_body = response.read().decode("utf-8", errors="replace")
                  status = response.status
          except urllib.error.HTTPError as exc:
              response_body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Feishu HTTP error {exc.code}: {response_body}")

          if not 200 <= status < 300:
              raise SystemExit(f"Unexpected Feishu HTTP status {status}: {response_body}")

          try:
              result = json.loads(response_body)
          except json.JSONDecodeError:
              raise SystemExit(f"Feishu returned non-JSON response: {response_body}")

          code = result.get("code")
          status_code = result.get("StatusCode")
          if code not in (None, 0) or status_code not in (None, 0):
              raise SystemExit(f"Feishu API error: {response_body}")

          state_file.write_text(event_id + "\n", encoding="utf-8")
          print(f"Sent event {event_id}")
          PY

      - name: Persist last sent event id
        run: |
          if git status --porcelain state/last-sent-id.txt 2>/dev/null | grep -q .; then
            git config user.name "sector-cycle-notifier"
            git config user.email "actions@users.noreply.github.com"
            git add state/last-sent-id.txt
            git commit -m "chore: advance notification cursor"
            git push
          else
            echo "No notifier state change."
          fi
